name: RocksDB CI

on: [ push, pull_request ]
env:
  RUST_VERSION: 1.88.0
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  doc-check:
    name: Rustdoc-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run cargo rustdoc
        run: cargo rustdoc -- -D warnings
  doctest: # doctest are no supported in cargo nextest yet. https://github.com/nextest-rs/nextest/issues/16
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run doctests
        run: cargo test --doc
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libjemalloc-dev
      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV
      - name: Run clippy
        run: |
          cargo clippy --all-targets --features \
            "jemalloc \
            io-uring \
            valgrind \
            mt_static \
            rtti \
            multi-threaded-cf \
            serde1" \
            -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [ Linux, macOS, Windows ]
        include:
          - build: Linux
            os: ubuntu-latest
          - build: macOS
            os: macos-latest
          - build: Windows
            os: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Remove msys64 # Workaround to resolve link error with C:\msys64\mingw64\bin\libclang.dll
        if: runner.os == 'Windows'
        run: Remove-Item -LiteralPath "C:\msys64\" -Force -Recurse
      - name: Install dependencies
        if: runner.os == 'Windows'
        run: choco install llvm -y
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjemalloc-dev
      - name: Mark working directory as read-only
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          touch Cargo.lock
          git submodule update --init --recursive
          chmod -R a-w .
          chmod -R a+w target Cargo.lock
      - name: Run rocksdb tests
        run: |
          cargo nextest run --all
          cargo nextest run --all --features multi-threaded-cf
      - name: Mark working directory as writable
        if: runner.os == 'Linux'
        run: chmod -R a+w .
      - name: Free disk space
        run: cargo clean
      - name: Mark working directory as read-only
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          touch Cargo.lock
          chmod -R a-w .
          chmod -R a+w target Cargo.lock
      - name: Run rocksdb tests (jemalloc)
        if: runner.os != 'Windows'
        run: cargo nextest run --all --features jemalloc
      - name: Mark working directory as writable
        if: runner.os == 'Linux'
        run: chmod -R a+w .

  test-cross:
    name: Linux-armv7-musl
    runs-on: ubuntu-latest
    env:
      # RocksDB requires a C++20 capable compiler, which is newer than the GCC 9 shipped by the
      # `cross` musl images. https://github.com/cross-tools/musl-cross provides current toolchains.
      MUSL_CROSS_VERSION: "20260515"
      TARGET: armv7-unknown-linux-musleabihf
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Install QEMU (armv7 user-mode)
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Install musl cross toolchain
        run: |
          curl --retry 3 -fsSL -o /tmp/toolchain.tar.xz \
            "https://github.com/cross-tools/musl-cross/releases/download/${MUSL_CROSS_VERSION}/${TARGET}.tar.xz"
          sudo mkdir -p /opt/x-tools
          sudo tar -xf /tmp/toolchain.tar.xz -C /opt/x-tools
          echo "/opt/x-tools/${TARGET}/bin" >> "$GITHUB_PATH"
      - name: Cross compile and run rocksdb tests
        env:
          CC_armv7_unknown_linux_musleabihf: armv7-unknown-linux-musleabihf-gcc
          CXX_armv7_unknown_linux_musleabihf: armv7-unknown-linux-musleabihf-g++
          AR_armv7_unknown_linux_musleabihf: armv7-unknown-linux-musleabihf-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: armv7-unknown-linux-musleabihf-gcc
          # The musl target links statically, so the emulator needs no sysroot.
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm-static
          BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_musleabihf: >-
            --target=armv7-unknown-linux-musleabihf
            --sysroot=/opt/x-tools/armv7-unknown-linux-musleabihf/armv7-unknown-linux-musleabihf/sysroot
        run: |
          cargo nextest run --all --target "$TARGET"
          cargo nextest run --all --target "$TARGET" --features multi-threaded-cf
